openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DLD Cell Sorting Simulator API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dld
    description: Deterministic Lateral Displacement simulation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dld/cells:
    get:
      operationId: getCells
      tags: [dld]
      summary: Get cell library
      description: Returns the predefined cell type library with typical diameters
      responses:
        "200":
          description: Cell library
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CellEntry"

  /dld/analyze:
    post:
      operationId: analyzeParticles
      tags: [dld]
      summary: Analyze two-particle separation
      description: Computes sorting efficiency and simulates trajectories for two particle types
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DldAnalyzeInput"
      responses:
        "200":
          description: Analysis result with trajectories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResponse"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dld/sweep:
    post:
      operationId: sweepGeometry
      tags: [dld]
      summary: Geometry parameter sweep
      description: Sweeps pillar gap G and array period N to find optimal sorting geometry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DldSweepInput"
      responses:
        "200":
          description: Sweep heatmap data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SweepResponse"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dld/flow-analysis:
    post:
      operationId: analyzeFlowRate
      tags: [dld]
      summary: Flow rate analysis
      description: >
        Sweeps flow velocity and computes sorting efficiency at each velocity,
        accounting for Reynolds-number-based degradation. Returns the optimal
        operating window for your geometry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DldFlowInput"
      responses:
        "200":
          description: Flow analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowAnalysisResponse"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dld/optimize:
    post:
      operationId: optimizeGeometry
      tags: [dld]
      summary: Optimize DLD geometry
      description: >
        Sweeps G and N over a configurable grid and scores each combination
        by the chosen objective (efficiency, Q_max, or Dc closest to a target).
        Returns the best (G, N) pair, the metric value, and the full grid as
        a value matrix for heatmap display.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeInput"
      responses:
        "200":
          description: Optimization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizeResponse"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dld/throughput:
    post:
      operationId: estimateThroughput
      tags: [dld]
      summary: Estimate cell throughput
      description: >
        Given chip geometry and sample parameters, computes cells-per-minute
        at the optimal flow rate, total processing time, and expected cell
        recovery. Internally runs the same Re-degradation flow model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DldThroughputInput"
      responses:
        "200":
          description: Throughput estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThroughputResponse"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dld/presets:
    get:
      operationId: getDldPresets
      tags: [dld]
      summary: Get preset chip geometries
      description: Returns 3 validated DLD chip geometries optimised for different sorting tasks
      responses:
        "200":
          description: Preset geometries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DldPreset"

  /dld/export-dxf:
    post:
      operationId: exportDxf
      tags: [dld]
      summary: Export mold DXF
      description: Generates a SolidWorks-compatible R12 ASCII DXF of the scaled-up pillar array mold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DxfExportInput"
      responses:
        "200":
          description: DXF file content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DxfExportResponse"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dld/dc-curve:
    post:
      operationId: getDcCurve
      tags: [dld]
      summary: Critical diameter vs pillar gap curves
      description: Returns Dc vs G data for multiple N values (Davis formula)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DcCurveInput"
      responses:
        "200":
          description: Dc curve data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DcCurveResponse"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    CellEntry:
      type: object
      required: [name, diameter]
      properties:
        name:
          type: string
        diameter:
          type: number

    DldAnalyzeInput:
      type: object
      required: [d1, d2, G, N]
      properties:
        d1:
          type: number
          description: Diameter of particle 1 (µm)
        d2:
          type: number
          description: Diameter of particle 2 (µm)
        G:
          type: number
          description: Pillar gap (µm)
        N:
          type: integer
          description: Array period (number of rows per repeat)
        label1:
          type: string
          description: Label for particle 1
        label2:
          type: string
          description: Label for particle 2

    DldSweepInput:
      type: object
      required: [d1, d2]
      properties:
        d1:
          type: number
          description: Diameter of particle 1 (µm)
        d2:
          type: number
          description: Diameter of particle 2 (µm)

    DcCurveInput:
      type: object
      required: [N_values]
      properties:
        N_values:
          type: array
          items:
            type: integer
          description: List of N values to plot curves for

    SortingResult:
      type: object
      required: [Dc, mode_p1, mode_p2, separated, delta_ld, efficiency, lateral_d1, lateral_d2]
      properties:
        Dc:
          type: number
          description: Critical diameter (µm)
        mode_p1:
          type: string
          description: bump or zigzag
        mode_p2:
          type: string
          description: bump or zigzag
        separated:
          type: boolean
          description: Whether particles are separated
        delta_ld:
          type: number
          description: Lateral displacement difference (µm/row)
        efficiency:
          type: number
          description: Sorting efficiency score 0-100
        lateral_d1:
          type: number
        lateral_d2:
          type: number

    TrajectoryPoint:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
        y:
          type: number

    PillarCircle:
      type: object
      required: [cx, cy, r]
      properties:
        cx:
          type: number
        cy:
          type: number
        r:
          type: number

    AnalyzeResponse:
      type: object
      required: [result, trajectory1, trajectory2, pillars]
      properties:
        result:
          $ref: "#/components/schemas/SortingResult"
        trajectory1:
          type: array
          items:
            $ref: "#/components/schemas/TrajectoryPoint"
        trajectory2:
          type: array
          items:
            $ref: "#/components/schemas/TrajectoryPoint"
        pillars:
          type: array
          items:
            $ref: "#/components/schemas/PillarCircle"

    SweepBest:
      type: object
      required: [G, N, efficiency, Dc]
      properties:
        G:
          type: number
        N:
          type: integer
        efficiency:
          type: number
        Dc:
          type: number

    SweepResponse:
      type: object
      required: [G_vals, N_vals, eff_matrix, best]
      properties:
        G_vals:
          type: array
          items:
            type: number
        N_vals:
          type: array
          items:
            type: integer
        eff_matrix:
          type: array
          items:
            type: array
            items:
              type: number
        best:
          $ref: "#/components/schemas/SweepBest"

    DldFlowInput:
      type: object
      required: [d1, d2, G, N]
      properties:
        d1:
          type: number
          description: Diameter of particle 1 (µm)
        d2:
          type: number
          description: Diameter of particle 2 (µm)
        G:
          type: number
          description: Pillar gap (µm)
        N:
          type: integer
          description: Array period
        channel_height_um:
          type: number
          description: Channel height in µm (default 50)
        channel_width_um:
          type: number
          description: Channel width in µm (default 500)
        v_max_mm_s:
          type: number
          description: Maximum velocity to sweep in mm/s (default 20)

    FlowPoint:
      type: object
      required: [v_mm_s, Re, flow_rate_ul_min, efficiency, regime]
      properties:
        v_mm_s:
          type: number
          description: Flow velocity (mm/s)
        Re:
          type: number
          description: Reynolds number
        flow_rate_ul_min:
          type: number
          description: Volumetric flow rate (µL/min)
        efficiency:
          type: number
          description: Actual sorting efficiency 0–100 after Re degradation
        regime:
          type: string
          description: "deep-stokes | stokes | transition | inertial"

    FlowAnalysisResponse:
      type: object
      required: [points, ideal_efficiency, Dc, optimal_v_min_mm_s, optimal_v_max_mm_s, optimal_q_min_ul_min, optimal_q_max_ul_min, re_crit, channel_height_um, channel_width_um]
      properties:
        points:
          type: array
          items:
            $ref: "#/components/schemas/FlowPoint"
        ideal_efficiency:
          type: number
          description: Geometry-only efficiency before flow degradation
        Dc:
          type: number
          description: Critical diameter (µm)
        optimal_v_min_mm_s:
          type: number
        optimal_v_max_mm_s:
          type: number
        optimal_q_min_ul_min:
          type: number
        optimal_q_max_ul_min:
          type: number
        re_crit:
          type: number
          description: Reynolds number where efficiency drops to 50%
        channel_height_um:
          type: number
        channel_width_um:
          type: number

    DldThroughputInput:
      type: object
      required: [d1, d2, G, N, concentration_cells_per_ml]
      properties:
        d1:
          type: number
          description: Diameter of particle 1 (µm)
        d2:
          type: number
          description: Diameter of particle 2 (µm)
        G:
          type: number
          description: Pillar gap (µm)
        N:
          type: integer
          description: Array period
        concentration_cells_per_ml:
          type: number
          description: Cell concentration in sample (cells/mL)
        sample_volume_ml:
          type: number
          description: Total sample volume to process (mL, default 1.0)
        channel_height_um:
          type: number
          description: Channel height in µm (default 50)
        channel_width_um:
          type: number
          description: Channel width in µm (default 500)

    ThroughputResponse:
      type: object
      required:
        - optimal_q_max_ul_min
        - throughput_cells_per_min
        - throughput_cells_per_hour
        - processing_time_min
        - total_cells_in_sample
        - recovered_cells
        - efficiency_at_optimal
        - concentration_cells_per_ml
        - sample_volume_ml
        - Dc
        - channel_height_um
        - channel_width_um
      properties:
        optimal_q_max_ul_min:
          type: number
          description: Maximum optimal flow rate (µL/min)
        throughput_cells_per_min:
          type: number
          description: Cells processed per minute at optimal Q_max
        throughput_cells_per_hour:
          type: number
          description: Cells processed per hour at optimal Q_max
        processing_time_min:
          type: number
          description: Minutes to process the full sample at optimal Q_max
        total_cells_in_sample:
          type: number
          description: Total cells in the input sample
        recovered_cells:
          type: number
          description: Estimated recovered (correctly sorted) cells
        efficiency_at_optimal:
          type: number
          description: Sorting efficiency (%) at optimal flow rate
        concentration_cells_per_ml:
          type: number
        sample_volume_ml:
          type: number
        Dc:
          type: number
          description: Critical diameter (µm)
        channel_height_um:
          type: number
        channel_width_um:
          type: number

    DldPreset:
      type: object
      required: [id, name, description, d1, d2, label1, label2, G, N, Dc, task]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        d1:
          type: number
        d2:
          type: number
        label1:
          type: string
        label2:
          type: string
        G:
          type: number
        N:
          type: integer
        Dc:
          type: number
        task:
          type: string

    DxfExportInput:
      type: object
      required: [G, N, scale]
      properties:
        G:
          type: number
          description: Pillar gap in µm
        N:
          type: integer
          description: Array period
        scale:
          type: number
          description: Scale multiplier (e.g. 50 means 50x scale-up for printing)
        label:
          type: string
          description: Chip label for DXF annotation
        n_rows:
          type: integer
          description: Number of pillar rows (default 20)
        n_cols:
          type: integer
          description: Number of pillar columns (default 8)

    DxfExportResponse:
      type: object
      required: [filename, dxf_content, chip_width_mm, chip_height_mm, pillar_diameter_mm, scale]
      properties:
        filename:
          type: string
        dxf_content:
          type: string
        chip_width_mm:
          type: number
        chip_height_mm:
          type: number
        pillar_diameter_mm:
          type: number
        scale:
          type: number

    DcCurveSeries:
      type: object
      required: [N, Dc_vals]
      properties:
        N:
          type: integer
        Dc_vals:
          type: array
          items:
            type: number

    DcCurveResponse:
      type: object
      required: [G_vals, curves]
      properties:
        G_vals:
          type: array
          items:
            type: number
        curves:
          type: array
          items:
            $ref: "#/components/schemas/DcCurveSeries"

    OptimizeInput:
      type: object
      required: [d1, d2, objective]
      properties:
        d1:
          type: number
          description: Diameter of particle 1 (µm)
        d2:
          type: number
          description: Diameter of particle 2 (µm)
        objective:
          type: string
          enum: [efficiency, q_max, dc_target]
          description: "Optimization objective: efficiency | q_max | dc_target"
        dc_target:
          type: number
          description: Target critical diameter for dc_target objective (µm)
        G_min:
          type: number
          description: Minimum pillar gap to sweep (µm, default 5)
        G_max:
          type: number
          description: Maximum pillar gap to sweep (µm, default 60)
        G_step:
          type: number
          description: Step size for pillar gap sweep (µm, default 5)
        N_min:
          type: integer
          description: Minimum array period to sweep (default 2)
        N_max:
          type: integer
          description: Maximum array period to sweep (default 15)
        channel_height_um:
          type: number
          description: Channel height in µm (default 50)
        channel_width_um:
          type: number
          description: Channel width in µm (default 500)

    OptimizePoint:
      type: object
      required: [G, N, value]
      properties:
        G:
          type: number
        N:
          type: integer
        value:
          type: number

    OptimizeResponse:
      type: object
      required: [objective, best_G, best_N, best_value, metric_label, points, G_vals, N_vals, value_matrix]
      properties:
        objective:
          type: string
        best_G:
          type: number
        best_N:
          type: integer
        best_value:
          type: number
        metric_label:
          type: string
        points:
          type: array
          items:
            $ref: "#/components/schemas/OptimizePoint"
        G_vals:
          type: array
          items:
            type: number
        N_vals:
          type: array
          items:
            type: integer
        value_matrix:
          type: array
          items:
            type: array
            items:
              type: number
